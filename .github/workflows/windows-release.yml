name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v5.3.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installers:
    name: Build NSIS installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: ARM64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw "Cargo metadata failed" }
          $metadata = $metadataJson | ConvertFrom-Json
          $versions = @($metadata.packages | Where-Object { $_.id -in $metadata.workspace_members } | Select-Object -ExpandProperty version -Unique)
          if ($versions.Count -ne 1 -or "v$($versions[0])" -cne $env:RELEASE_TAG) {
            throw "Release tag $env:RELEASE_TAG does not match workspace versions: $versions"
          }
          $installer = Get-Content installer.nsi -Raw
          $match = [regex]::Match($installer, '(?m)^!define PRODUCT_VERSION "([^"]+)"')
          if (-not $match.Success -or $match.Groups[1].Value -cne $versions[0]) {
            throw "Installer version does not match Cargo version"
          }

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )

          $makensis = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $makensis) {
            # Portable NSIS avoids Chocolatey feed outages. Pin and verify every download.
            $nsisRoot = Join-Path $env:RUNNER_TEMP "nsis-portable"
            $nsisZip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
            $expectedHash = "c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1"
            $urls = @(
              "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip",
              "http://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              try {
                & curl.exe --fail --location --silent --show-error --max-time 60 --output $nsisZip $url
                if ($LASTEXITCODE -ne 0) { throw "curl download exited with $LASTEXITCODE" }
                if ((Get-FileHash -LiteralPath $nsisZip -Algorithm SHA256).Hash -ne $expectedHash) {
                  throw "NSIS archive SHA256 mismatch (possibly a mirror HTML response)"
                }
                $downloaded = $true
                break
              } catch {
                Write-Warning "NSIS download failed from ${url}: $($_.Exception.Message)"
              }
            }
            if (-not $downloaded) { throw "Cannot download pinned NSIS distribution" }
            Expand-Archive -LiteralPath $nsisZip -DestinationPath $nsisRoot -Force
            $makensis = Join-Path $nsisRoot "nsis-3.11/makensis.exe"
          }

          if (-not $makensis -or -not (Test-Path -LiteralPath $makensis)) {
            throw "makensis.exe not found after NSIS setup"
          }

          "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run workspace tests
        if: matrix.arch == 'x64'
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Create dist directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "$env:NSIS_EXE" "/DARCH=${{ matrix.arch }}" "installer.nsi"

      - name: Verify packaged manager resources and startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "dist/CBXShell-rs-Setup-*-${{ matrix.arch }}.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one installer" }
          $staging = Join-Path $env:RUNNER_TEMP ("cbxmanager-smoke-" + [guid]::NewGuid())
          7z x $installers[0].FullName "-o$staging" cbxmanager.exe cbxshell.dll -y
          if ($LASTEXITCODE -ne 0) { throw "Installer extraction failed" }
          $packagedManager = Join-Path $staging "cbxmanager.exe"
          $builtHash = (Get-FileHash "target/${{ matrix.rust_target }}/release/cbxmanager.exe").Hash
          if ((Get-FileHash $packagedManager).Hash -ne $builtHash) { throw "Packaged manager differs from built executable" }
          ./scripts/test-manager-startup.ps1 -Executable $packagedManager -ResourceOnly:('${{ matrix.arch }}' -eq 'ARM64')

      - name: Upload installer artifact
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/CBXShell-rs-Setup-*-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Preview installer output (act)
        if: ${{ github.actor == 'nektos/act' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist/CBXShell-rs-Setup-*-${{ matrix.arch }}.exe" |
            Select-Object FullName, Length |
            Format-Table -AutoSize

  release:
    name: Publish GitHub Release
    if: ${{ github.actor != 'nektos/act' }}
    needs: build-installers
    runs-on: windows-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag_name) || github.ref }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: Prepare bilingual release template
        shell: pwsh
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $Tag = $env:REQUESTED_RELEASE_TAG
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$Tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NAME_EN=CBXShell-rs $Tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NAME_KO=CBXShell-rs $Tag 릴리즈"

          $Body = @"
          ## 🇺🇸 Release Overview
          - This release includes NSIS installers for **x86-64 (x64)** and **ARM64** Windows.
          - Please choose the installer that matches your system architecture.

          ## 🇰🇷 릴리즈 안내
          - 이번 릴리즈에는 Windows용 **x86-64(x64)** 및 **ARM64** NSIS 설치 파일이 포함되어 있습니다.
          - 사용 중인 시스템 아키텍처에 맞는 설치 파일을 선택해 주세요.

          ### Installers / 설치 파일
          - `CBXShell-rs-Setup-<version>-x64.exe`
          - `CBXShell-rs-Setup-<version>-ARM64.exe`

          ---
          _Auto-generated commit-based release notes are attached below._
          _아래에는 커밋 기반 자동 생성 릴리즈 노트가 이어집니다._
          "@

          $Body | Set-Content -Path release_body.md -Encoding utf8

          $SummaryCandidates = @(
            ".github/release-notes/$Tag.md",
            ".github/release-notes/$($Tag.TrimStart('v')).md",
            ".github/release-notes/$Tag-release-summary.md",
            ".github/release-notes/$($Tag.TrimStart('v'))-release-summary.md"
          )
          $SummaryPath = $SummaryCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($SummaryPath) {
            Add-Content -Path release_body.md -Value "`n---`n"
            Get-Content -Path $SummaryPath | Add-Content -Path release_body.md
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: |
            ${{ env.RELEASE_NAME_EN }}
            ${{ env.RELEASE_NAME_KO }}
          body_path: release_body.md
          files: dist/CBXShell-rs-Setup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
