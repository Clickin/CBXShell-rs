[workspace]
members = [
    "CBXShell",
    "cbxmanager",
    "crates/cbxshell-core",
    "crates/cbxshell-archive",
    "crates/cbxshell-image",
    "crates/cbxshell-image-magic",
    "crates/cbxshell-image-codec",
    "crates/cbxshell-image-resize",
    "crates/cbxshell-bitmap-win",
    "crates/cbxshell-thumbnail-win",
    "crates/cbxshell-thumbnail-cache",
    "crates/cbxshell-gui-win",
]
resolver = "2"

[workspace.package]
version = "5.3.2"
authors = ["CBXShell Contributors"]
edition = "2021"
license = "CPOL-1.02"
rust-version = "1.89"

[workspace.dependencies]
# Windows COM and APIs
windows = { version = "0.52", features = [
    "Data_Json",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "implement",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_Security",
]}
windows-core = "0.52"

# Archive formats
zip = "0.6"
unrar = "0.5"
sevenz-rust = "0.5"

# Image processing
image = { version = "0.25", default-features = false, features = ["avif", "webp", "jpeg", "png", "gif", "bmp", "tiff", "ico"] }
fast_image_resize = "4.0"

# Utilities
natord = "1.0"
winreg = "0.52"
widestring = "1.0"
sha2 = "0.10"

# GUI framework (for manager binary)
native-windows-gui = { version = "1.0.13", default-features = false }
native-windows-derive = "1.0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
cbxshell-core = { path = "crates/cbxshell-core" }
cbxshell-archive = { path = "crates/cbxshell-archive" }
cbxshell-image = { path = "crates/cbxshell-image" }
cbxshell-image-magic = { path = "crates/cbxshell-image-magic" }
cbxshell-image-codec = { path = "crates/cbxshell-image-codec" }
cbxshell-image-resize = { path = "crates/cbxshell-image-resize" }
cbxshell-bitmap-win = { path = "crates/cbxshell-bitmap-win" }
cbxshell-thumbnail-win = { path = "crates/cbxshell-thumbnail-win" }
cbxshell-thumbnail-cache = { path = "crates/cbxshell-thumbnail-cache" }
cbxshell-gui-win = { path = "crates/cbxshell-gui-win" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
